name: Desplegar en OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; no cancelamos el que esté en curso.
concurrency:
  group: ovh
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Iconos
        run: npm run icons

      # afinador.bandasaludcordoba.es sirve la carpeta `afinador` en su raíz,
      # así que el base es `/` (el valor por defecto de vite.config.js).
      - name: Build
        run: npm run build

      # Secrets necesarios (Settings -> Secrets and variables -> Actions):
      # FTP_SERVER (ftp.clusterXXX.hosting.ovh.net), FTP_USER y FTP_PASSWORD.
      # El hosting compartido de OVH no da shell, así que no vale rsync: se
      # sube por SFTP (puerto 22) con lftp. La ruta es relativa al home del
      # usuario FTP. Se conserva .htaccess por si se añade a mano en el servidor.
      - name: Subir a OVH por SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y --no-install-recommends lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes
            set net:max-retries 2
            mirror --reverse --delete --parallel=4 --verbose --exclude-glob .htaccess dist/ afinador/
            bye
          "
