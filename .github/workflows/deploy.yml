name: Desplegar en OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; no cancelamos el que esté en curso.
concurrency:
  group: ovh
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Iconos
        run: npm run icons

      # afinador.bandasaludcordoba.es sirve la carpeta `afinador` en su raíz,
      # así que el base es `/` (el valor por defecto de vite.config.js).
      - name: Build
        run: npm run build

      # Secrets necesarios (Settings -> Secrets and variables -> Actions):
      # FTP_SERVER (ftp.clusterXXX.hosting.ovh.net), FTP_USER y FTP_PASSWORD.
      - name: Subir a OVH por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: afinador/
