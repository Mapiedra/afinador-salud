<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" class="dibujo" style="--eje-x: -1; --eje-y: 0" aria-hidden="true" focusable="false">
  <!-- Corneta espanola de llaves, en plano y de formas macizas: cuerpo,
       tudel y campana, nada mas. Se afina extrayendo el tudel, que lleva
       montada la boquilla, asi que ambos se mueven juntos. -->

  <!-- Campana -->
  <path
    class="dibujo__campana"
    fill="currentColor"
    d="M 112 54 C 152 50 178 38 208 10 C 219 27 221 66 212 104 C 184 92 156 80 128 70 C 122 66 116 60 112 54 Z"
  />

  <!-- Cuerpo: el bucle ovalado -->
  <rect
    class="dibujo__tubos"
    x="34"
    y="62"
    width="118"
    height="54"
    rx="27"
    fill="none"
    stroke="currentColor"
    stroke-width="17"
  />

  <!-- Tudel con su boquilla: la pieza que se extrae para afinar -->
  <g class="dibujo__ajuste" data-ajuste fill="currentColor">
    <rect x="4" y="42" width="17" height="18" rx="5" />
    <rect x="17" y="47" width="66" height="9" rx="4.5" />
  </g>

  <!-- Flecha: dibujada en el sentido de SACAR; la UI la invierte para meter -->
  <g
    class="dibujo__flecha"
    data-flecha
    fill="none"
    stroke="currentColor"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 68 22 H 38" />
    <path d="M 45 14 L 37 22 L 45 30" />
  </g>
</svg>
