<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 1 180 246" class="dibujo" style="--eje-x: 1; --eje-y: 0" aria-hidden="true" focusable="false">
  <!-- Tuba en plano y de formas macizas, y en vertical: es como se sostiene y
       es lo que permite que el dibujo aproveche el alto de la tarjeta.
       La bomba general sale por la derecha del cuerpo. -->

  <!-- Campana, hacia arriba -->
  <g class="dibujo__campana" fill="currentColor">
    <rect x="68" y="6" width="112" height="12" rx="6" />
    <path d="M 72 18 C 92 46 106 76 112 104 L 136 104 C 142 76 156 46 176 18 Z" />
  </g>

  <g class="dibujo__tubos" fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- Tubo de la campana -->
    <path d="M 124 100 V 200" stroke-width="24" />
    <!-- Cuerpo: el bucle grande -->
    <rect x="26" y="84" width="98" height="148" rx="46" stroke-width="20" />
    <!-- Vuelta interior -->
    <rect x="56" y="106" width="46" height="104" rx="23" stroke-width="12" />
  </g>

  <!-- Tudel y boquilla -->
  <g class="dibujo__pieza" fill="currentColor">
    <rect x="118" y="128" width="62" height="14" rx="7" />
    <rect x="172" y="121" width="16" height="28" rx="7" />
  </g>

  <!-- Virola del tudel -->
  <rect class="dibujo__pieza" x="124" y="125" width="22" height="20" rx="3" fill="currentColor" opacity="0.5" />

  <!-- Bomba general -->
  <g
    class="dibujo__ajuste"
    data-ajuste
    fill="none"
    stroke="currentColor"
    stroke-width="15"
    stroke-linecap="round"
  >
    <path d="M 124 166 H 152 A 15 15 0 0 1 152 196 H 124" />
  </g>

  <!-- Flecha: dibujada en el sentido de SACAR; la UI la invierte para meter -->
  <g
    class="dibujo__flecha"
    data-flecha
    fill="none"
    stroke="currentColor"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 156 218 H 184" />
    <path d="M 176 210 L 185 218 L 176 226" />
  </g>
</svg>
