<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 250 134" class="dibujo" style="--eje-x: 1; --eje-y: 0" aria-hidden="true" focusable="false">
  <!-- Trompeta en plano y de formas macizas. La bomba general se solapa con
       la campana, como en el instrumento real: va dibujada la ultima para que
       se pinte por encima, y ademas se tine con el color de estado, asi que
       se distingue sobre el dorado tanto parada como desplazandose. -->

  <!-- Campana -->
  <path
    class="dibujo__campana"
    fill="currentColor"
    d="M 172 66 C 196 62 212 50 230 26 C 242 50 242 100 232 126 C 212 106 194 92 172 88 Z"
  />

  <g class="dibujo__tubos" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round">
    <!-- Tudel -->
    <path d="M 20 40 H 178" />
    <!-- Tubo intermedio -->
    <path d="M 178 60 H 66" />
    <!-- Codo trasero -->
    <path d="M 66 60 H 58 A 10 10 0 0 0 58 82 H 66" />
    <!-- Tubo de campana -->
    <path d="M 58 82 H 176" />
  </g>

  <!-- Boquilla -->
  <path class="dibujo__pieza" fill="currentColor" d="M 0 30 L 22 36 L 22 45 L 0 51 Z" />

  <!-- Pistones -->
  <g class="dibujo__pistones" fill="currentColor">
    <rect x="82" y="26" width="18" height="50" rx="9" />
    <rect x="106" y="26" width="18" height="50" rx="9" />
    <rect x="130" y="26" width="18" height="50" rx="9" />
    <rect x="87" y="8" width="8" height="20" rx="4" />
    <rect x="111" y="8" width="8" height="20" rx="4" />
    <rect x="135" y="8" width="8" height="20" rx="4" />
    <rect x="82" y="2" width="18" height="8" rx="4" />
    <rect x="106" y="2" width="18" height="8" rx="4" />
    <rect x="130" y="2" width="18" height="8" rx="4" />
  </g>

  <!-- Bomba general: la U del frente. Va la ultima, por encima de la campana. -->
  <g
    class="dibujo__ajuste"
    data-ajuste
    fill="none"
    stroke="currentColor"
    stroke-width="13"
    stroke-linecap="round"
  >
    <path d="M 162 40 H 186 A 10 10 0 0 1 186 60 H 162" />
  </g>

  <!-- Flecha: dibujada en el sentido de SACAR; la UI la invierte para meter -->
  <g
    class="dibujo__flecha"
    data-flecha
    fill="none"
    stroke="currentColor"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 200 14 H 236" />
    <path d="M 228 6 L 237 14 L 228 22" />
  </g>
</svg>
