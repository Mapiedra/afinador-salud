<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" class="dibujo" style="--eje-x: -1; --eje-y: 0" aria-hidden="true" focusable="false">
  <!-- Boquilla -->
  <path class="dibujo__pieza" d="M 10 24 L 24 28 L 24 36 L 10 40 Z" fill="currentColor" stroke="none" />

  <g class="dibujo__tubos" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <!-- Tudel -->
    <path d="M 22 32 C 44 30 58 40 64 56" />
    <!-- Salida de la bomba hacia los pistones -->
    <path d="M 58 86 H 100" />
    <!-- Codo inferior del cuerpo -->
    <path d="M 100 106 V 120 H 172" />
  </g>

  <!-- Campana conica hacia arriba -->
  <g class="dibujo__campana" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <path d="M 164 120 C 158 82 160 50 148 22" />
    <path d="M 186 120 C 198 82 208 50 232 22" />
    <path d="M 148 22 A 42 9 0 0 0 232 22" />
  </g>

  <!-- Bomba general, junto al tudel -->
  <g class="dibujo__bomba" data-bomba fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
    <path d="M 68 56 H 46 A 15 15 0 0 0 46 86 H 68" />
  </g>

  <!-- Pistones -->
  <g class="dibujo__pistones" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <rect x="93" y="54" width="15" height="52" rx="7" fill="var(--dibujo-fondo, #12100c)" />
    <rect x="114" y="54" width="15" height="52" rx="7" fill="var(--dibujo-fondo, #12100c)" />
    <rect x="135" y="54" width="15" height="52" rx="7" fill="var(--dibujo-fondo, #12100c)" />
    <path d="M 100.5 54 V 44 M 121.5 54 V 44 M 142.5 54 V 44" fill="none" />
  </g>

  <g class="dibujo__flecha" data-flecha fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 48 116 H 24" />
    <path d="M 31 109 L 24 116 L 31 123" />
  </g>
</svg>
