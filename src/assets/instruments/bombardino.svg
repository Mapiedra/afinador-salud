<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 180 252" class="dibujo" style="--eje-x: -1; --eje-y: 0" aria-hidden="true" focusable="false">
  <!-- Bombardino en plano y de formas macizas, y en vertical. Campana arriba
       a la izquierda y pistones a la derecha: es el espejo de la tuba, que
       lleva la campana a la derecha, y asi se distinguen de un vistazo.
       La bomba general sale por la izquierda, junto al tudel. -->

  <!-- Campana, hacia arriba -->
  <g class="dibujo__campana" fill="currentColor">
    <rect x="12" y="6" width="96" height="12" rx="6" />
    <path d="M 16 18 C 34 46 48 74 54 100 L 78 100 C 84 74 94 46 104 18 Z" />
  </g>

  <g class="dibujo__tubos" fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- Tubo de campana y codo inferior -->
    <path d="M 66 96 V 186 C 66 212 84 228 110 228 H 130" stroke-width="22" />
    <!-- Cuerpo -->
    <rect x="104" y="96" width="68" height="132" rx="32" stroke-width="20" />
  </g>

  <!-- Pistones -->
  <g class="dibujo__pistones" fill="currentColor">
    <rect x="112" y="78" width="16" height="58" rx="8" />
    <rect x="134" y="78" width="16" height="58" rx="8" />
    <rect x="156" y="78" width="16" height="58" rx="8" />
    <rect x="115" y="60" width="10" height="20" rx="5" />
    <rect x="137" y="60" width="10" height="20" rx="5" />
    <rect x="159" y="60" width="10" height="20" rx="5" />
  </g>

  <!-- Tudel y boquilla -->
  <g class="dibujo__pieza" fill="currentColor">
    <rect x="42" y="112" width="66" height="13" rx="6.5" />
    <rect x="32" y="106" width="16" height="26" rx="7" />
  </g>

  <!-- Bomba general, junto al tudel -->
  <g
    class="dibujo__ajuste"
    data-ajuste
    fill="none"
    stroke="currentColor"
    stroke-width="14"
    stroke-linecap="round"
  >
    <path d="M 60 142 H 36 A 14 14 0 0 0 36 170 H 60" />
  </g>

  <!-- Flecha: dibujada en el sentido de SACAR; la UI la invierte para meter -->
  <g
    class="dibujo__flecha"
    data-flecha
    fill="none"
    stroke="currentColor"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 44 200 H 16" />
    <path d="M 24 192 L 15 200 L 24 208" />
  </g>
</svg>
